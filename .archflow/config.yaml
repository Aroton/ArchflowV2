# ArchFlow copies this template to .archflow/config.yaml during repository initialization.
# Task creation copies it to .archflow/tasks/<task>/config.yaml, which stays an ordinary
# editable input: edit it at any point and the next workflow step uses the new values.
# Status reports field-level changes since the last state transaction — nothing blocks.
#
# The producer is whatever client session connects to the server — it needs no
# config. These roles describe only the children the server dispatches.
schema_version: "1"
roles:
  counter-reviewer:
    model: claude-opus-5
    effort: medium
  adjudicator:
    model: claude-opus-5
    effort: medium

# Routes accept an optional `provider`: a cc-switch provider id (claude routes
# only). When set, the dispatched claude child is launched through
# `cc-switch start claude <provider> -- ...` instead of directly. Unset or
# empty means a plain direct launch. Example:
#   counter-reviewer:
#     model: glm-5.3
#     effort: high
#     provider: zai

# Optional. Caps produce re-entries per phase instance before the attempts-exhausted
# gate opens; defaults to 3. This is a thrash backstop, not the primary brake — the
# loop ends when triage accepts nothing, so review convergence is a triage judgment.
# max_attempts: 3

# Optional. Per-phase-kind role overrides on top of the default roles above. Each key
# is a phase kind (explore, prd, design, phase-design, phase-impl) and its value is the
# same roles shape, listing only the routes to override for that kind. The schema is
# `configOverridesSchema` in src/contracts/config.ts. Example:
# overrides:
#   phase-design:
#     counter-reviewer:
#       model: glm-5.3
#       effort: high
#   phase-impl:
#     adjudicator:
#       model: claude-opus-5
#       effort: high

# Optional. Approval triggers declare which completed steps wait for explicit human
# judgment. `subjects` may contain prd, design, phase-design, or phase-impl. `content`
# rules watch paths a result changed: every repository path an implementation
# touched, and the task's own governing documents when a later phase rewrites them
# (`.archflow/tasks/<task>/design.md` is the architecture design, `prd.md` the PRD).
# Counter-review still runs for every subject; when no rule matches and no safety
# condition opens a gate, the authenticated workflow advances and commits without a
# human decision. The shipped defaults gate the PRD, the architecture design, any
# later rewrite of either, and SQL changes — a phase design or implementation that
# changes only its own phase runs to commit on its own.
approval_rules:
  subjects: [prd, design]
  content:
    - paths: ["**/*.sql"]
    - paths: [".archflow/tasks/*/design.md", ".archflow/tasks/*/prd.md"]

