# ArchFlow copies this template to .archflow/config.yaml during repository initialization.
# Task creation copies and byte-pins it at .archflow/tasks/<task>/config.yaml.
# Changing routing after that point requires creating a new task.
schema_version: "1"
roles:
  producer:
    model: claude-opus-5
    effort: high
  counter-reviewer:
    model: gpt-5.6-sol
    effort: xhigh
  adjudicator:
    model: gpt-5.6-sol
    effort: xhigh

# Optional. Caps produce re-entries per phase instance before the attempts-exhausted
# gate opens; defaults to 3. This is a thrash backstop, not the primary brake — the
# loop ends when triage accepts nothing, so review convergence is a triage judgment.
# max_attempts: 3

