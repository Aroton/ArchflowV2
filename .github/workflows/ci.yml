name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["24.15.0", "24.18.0"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm run probe:mcp-sdk-compatibility
      - run: npm run typecheck
      - run: npm run test:mcp-runtime
      - run: npm test
      - run: npm run test:contracts
      - run: npm run build:temp
      - run: npm run check:dependencies
      - run: npm run check:notices
      - run: npm run test:notices-policy
      - run: npm run check:mcp-sdk-boundary
      - run: npm run test:mcp-sdk-boundary-policy
      - run: npm run release:check -- --payload dist
      - run: npm run release:smoke -- --payload dist
      - run: npm run release:mutations
      - run: npm run release:reproduce
      - run: npm run release:stage -- --output "${RUNNER_TEMP}/archflow-release-stage"
      - run: npm run release:check -- --payload dist --compare "${RUNNER_TEMP}/archflow-release-stage"
      - run: test ! -e .tmp
