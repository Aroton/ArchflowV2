name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["24.15.0", "24.18.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:contracts
      - run: npm run build:temp
      - run: npm run check:dependencies
      - run: npm run check:notices
      - run: npm run test:notices-policy
      - name: Assert no tracked-release bundle was produced
        run: test ! -e dist
