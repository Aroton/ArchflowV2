# ArchFlow copies this template to .archflow/config.yaml during repository initialization.
# Task creation copies it to .archflow/tasks/<task>/config.yaml, which stays an ordinary
# editable input: edit it at any point and the next workflow step uses the new values.
# Status reports field-level changes since the last state transaction — nothing blocks.
#
# The producer is whatever client session connects to the server — it needs no
# config. These roles describe only the children the server dispatches.
schema_version: "1"
# Fallback roles used only when a connected client is not listed under `producers` below:
roles:
  counter-reviewer:
    model: gpt-5.6-sol
    effort: medium
  # Used only for phase-design and phase-impl. Older task configs without this
  # role receive this shipped Luna/xhigh route as the final fallback; general
  # reviewers never inherit the test-owned criteria.
  test-reviewer:
    model: gpt-5.6-luna
    effort: xhigh
  # Used only for phase-design. Assigns implementation model + effort per component.
  effort-reviewer:
    model: gpt-5.6-luna
    effort: xhigh
  adjudicator:
    model: gemini-3.7-flash-high
    effort: high

# Client-specific counter-review and constitution review routing
producers:
  claude:
    counter-reviewer:
      model: gpt-5.6-sol
      effort: medium
    adjudicator:
      model: gemini-3.7-flash-high
      effort: high
  antigravity:
    counter-reviewers:
      - model: gpt-5.6-sol
        effort: medium
      - model: claude-fable-5
        effort: medium
    adjudicator:
      model: gemini-3.7-flash-high
      effort: high
  codex:
    counter-reviewer:
      model: claude-fable-5
      effort: medium
    adjudicator:
      model: gemini-3.7-flash-high
      effort: high

# Routes accept an optional `provider`: a cc-switch provider id (claude routes
# only). When set, the dispatched claude child is launched through
# `cc-switch start claude <provider> -- ...` instead of directly. Unset or
# empty means a plain direct launch. Example:
#   counter-reviewer:
#     model: glm-5.3
#     effort: high
#     provider: zai

# Optional. Caps produce re-entries per phase instance before the attempts-exhausted
# gate opens; defaults to 3. This is a thrash backstop, not the primary brake — the
# loop ends when triage accepts nothing, so review convergence is a triage judgment.
# max_attempts: 3

# Optional task repository set. Task creation copies this declaration into the
# task-local config; that task remains the only source of task resources, policy,
# and workflow authority. `primary` is reserved for the repository containing
# `.archflow/` and is always present and writable.
#
# Secondary names use task-slug syntax. Paths may be absolute or relative to the
# primary worktree root. Omitted mode means `context-only`. `writable` allows a
# phase implementation to declare, review, restore, and commit changes there.
# Every implementation submission includes one section for every writable
# secondary, even when its outputs are empty so undeclared changes can be found.
# Context-only repositories are review context and are never written.
# Config edits are ordinary informational changes and do not themselves block or
# reroute the workflow. Status reports primary first, then secondaries in ordinal
# name order regardless of YAML key order.
#
# Reviewers receive one named, pinned view per configured repository. Changed
# writable members use their exact proposed trees; unchanged writable and
# context-only members remain commit-pinned context. Approval `content` globs match
# each repository's own repository-relative path, so `**/*.sql` matches SQL in any
# writable repository and a rule like `apis/src/**` does not address a secondary by
# name; humans see matches displayed as `<name>/<path>`.
# repositories:
#   apis:
#     path: ../apis
#   stripe:
#     path: /work/services/stripe
#     mode: writable

# Optional. Per-phase-kind role overrides on top of the default roles above. Each key
# is a phase kind (explore, prd, design, phase-design, phase-impl) and its value is the
# same roles shape, listing only the routes to override for that kind. The schema is
# `configOverridesSchema` in src/contracts/config.ts. Example:
# overrides:
#   phase-design:
#     counter-reviewer:
#       model: glm-5.3
#       effort: high
#   phase-impl:
#     adjudicator:
#       model: claude-opus-5
#       effort: high

# Optional. Approval triggers declare which completed steps wait for explicit human
# judgment. `subjects` may contain prd, design, phase-design, or phase-impl. `content`
# rules watch paths a result changed: every repository path an implementation
# touched, and the task's own governing documents when a later phase rewrites them
# (`.archflow/tasks/<task>/design.md` is the architecture design, `prd.md` the PRD).
# Counter-review still runs for every subject; when no rule matches and no safety
# condition opens a gate, the authenticated workflow advances and commits without a
# human decision. The shipped defaults gate the PRD, the architecture design, any
# later rewrite of either, and SQL changes — a phase design or implementation that
# changes only its own phase runs to commit on its own.
approval_rules:
  subjects: [prd, design]
  content:
    - paths: ["**/*.sql"]
    - paths: [".archflow/tasks/*/design.md", ".archflow/tasks/*/prd.md"]
