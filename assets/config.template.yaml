# ArchFlow copies this template to .archflow/config.yaml during repository initialization.
# `archflow-local review` reads it from the working tree on every review, so edits take
# effect on the next review.
#
# The producer is whatever client session asks for the review — it needs no routing
# config. Roles describe the reviewers review dispatches.
schema_version: "1"
# Fallback roles used only when the asking client is not listed under `producers` below:
roles:
  counter-reviewer:
    model: gpt-6.1-sol
    effort: high
  # Reviews the tests and verification. Configs without this role receive this
  # Sol 6.1/low route as the final fallback; general reviewers never inherit the
  # test-owned criteria.
  test-reviewer:
    model: gpt-6.1-sol
    effort: low
  adjudicator:
    model: gemini-4-hydrogen-high
    effort: high

# Client-specific counter-review and constitution review routing
producers:
  claude:
    counter-reviewer:
      model: gpt-6.1-sol
      effort: high
    adjudicator:
      model: gemini-4-hydrogen-high
      effort: high
  antigravity:
    counter-reviewers:
      - model: gpt-6.1-sol
        effort: high
      - model: claude-opus-5-5
        effort: medium
    adjudicator:
      model: gemini-4-hydrogen-high
      effort: high
  codex:
    counter-reviewer:
      model: claude-opus-5-5
      effort: medium
    adjudicator:
      model: gemini-4-hydrogen-high
      effort: high

# Routes accept an optional `provider`: a cc-switch provider id (claude routes
# only). When set, the dispatched claude child is launched through
# `cc-switch start claude <provider> -- ...` instead of directly. Unset or
# empty means a plain direct launch. Example:
#   counter-reviewer:
#     model: glm-5.3
#     effort: high
#     provider: zai

# Optional. Per-stage role overrides on top of the roles above: `phase-design` applies
# to plan reviews and `phase-impl` to implementation reviews. Each value is the same
# roles shape, listing only the routes to override for that stage. The schema is
# `configOverridesSchema` in src/contracts/config.ts. Example:
# overrides:
#   phase-design:
#     counter-reviewer:
#       model: glm-5.3
#       effort: high
#   phase-impl:
#     adjudicator:
#       model: claude-opus-5-5
#       effort: medium

# Optional. Approval triggers name the reviews whose result must also go to a human:
# a matching rule adds a human review reason to the review result. `subjects` may
# contain `phase-design` (every plan review) or `phase-impl` (every implementation
# review). `content` rules match the repository paths a review covers. The shipped
# default flags every changed .sql file; the database constitution rule covers
# embedded queries, ORM operations, and schema/data migrations.
approval_rules:
  subjects: []
  content:
    - paths: ["**/*.sql"]
