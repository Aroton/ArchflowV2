# Server-owned counter-review rubric for the "design" and "phase-design" phase kinds.
#
# The MCP server reads and strictly parses this file fresh on every review and
# status call; a missing or invalid file fails the review closed. `rubric_id` is
# cross-checked against the phase kind that selects this file and is excluded
# from the rubric digest. Criterion order is significant: the digest and the
# review contract both depend on it. See README.md for the editing rules.
rubric_id: design-v2
schema_version: "1"
kind: artifact
mode: adversarial
criteria:
  - id: substantive-correctness
    text: "Report a finding only for a material defect: leaving the artifact unchanged is reasonably likely to change downstream behavior, implementation, verification, delivery, or important risk. A blocking finding must cite exact artifact, pinned, or repository evidence; name the concrete consequence; and explain why it survives stated non-goals and priorities. Wording is blocking only when it permits materially different reasonable interpretations. If prior-triage is present, make verification of accepted revision intents the primary task; report a previously undiscovered issue only when it clears the same materiality bar. Challenge a prior disposition only when its revision intent was not carried out or the change introduced a material defect. Do not report optional polish or preferred alternatives without a material consequence."
    blocking: true
  - id: upstream-coverage
    text: "Report only an upstream requirement that is materially unmapped or contradicted, or a substantial design element with no upstream purpose. Do not report traceability polish that would not change the design or its verification."
    blocking: true
  - id: interface-reality
    text: "Report a repository or interface claim only when pinned or repository evidence materially contradicts it. Use unverifiable-claims only when missing evidence prevents a material judgment."
    blocking: true
  - id: evidence-completeness
    text: "Report an unaddressed adjacent component only when the omission is reasonably likely to break a stated design element, interface, verification result, or important risk boundary."
    blocking: true
  - id: proportionality
    text: "Report only layers, abstractions, phases, or machinery for unstated futures when they would materially increase complexity, cost, delivery time, or maintenance risk. Do not report minor simplifications or stylistic preferences."
    blocking: true
  - id: phase-plan-soundness
    text: "Report a phase-plan ordering, sizing, scope, boundary, or verification defect only when leaving it unchanged is reasonably likely to materially harm implementation, verification, review, delivery, or create an important risk. For architecture design, require an inspectable split-and-merge sizing attempt: each finite phase has one coherent repository-ready outcome, a valid completion state, explicit predecessors or stable inputs, and one meaningful verification story; consider splitting bundled independently implementable or verifiable outcomes and merging scaffolding, file-, type-, or layer-only fragments without a stable checkpoint. Require concrete atomicity, repository-validity, inseparable-verification, stable-interface, or risk-reduction value for a retained unusually broad or small phase. For a genuinely open-ended plan, require an explanation of why responsible boundaries cannot yet be named and what information will enable decomposition; report using the marker merely to avoid the sizing attempt. For numbered phase design, perform only the bounded fit check against concrete repository, interface, dependency, risk, and verification evidence: preserve a sound approved boundary, but report when a material split or merge is needed and the producer neither corrects the writable parent through the reviewed path nor follows returned authority. Phase count, layer count, file count, diff size, and reviewer preference are not dispositive; report a defect only with its concrete consequence."
    blocking: true
  - id: unverifiable-claims
    text: "When missing pinned or read-only repository evidence prevents a material judgment, record one non-blocking finding naming the claim and missing file or interface, with a finding_id beginning unverifiable-. Never guess. Omit gaps that cannot materially affect the review, report each material gap once, and do not re-report one already named in prior-triage."
    blocking: false
  - id: reviewer-confidence
    text: "When a material judgment cannot be made with confidence from the artifact, its approved upstream documents, and the supplied repository snapshot, record one non-blocking finding with a finding_id beginning escalate-, citing the exact judgment that could not be made and what evidence or clarification would settle it. Report escalate- only for a question that could materially change the verdict; a missing document or evidence gap belongs to unverifiable-claims, and never guess in either place."
    blocking: false
  - id: advisory-observations
    text: "Do not report non-material observations, optional improvements, completeness suggestions, stylistic preferences, or harmless wording refinements. A sound, decision-ready artifact should return no findings rather than a list of possible enhancements. Formatting, lint, type-checking, naming, and import-order findings belong to the deterministic tools that own them; never report them."
    blocking: false
