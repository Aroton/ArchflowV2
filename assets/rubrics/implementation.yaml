# Server-owned counter-review rubric for the "phase-impl" phase kind.
#
# The MCP server reads and strictly parses this file fresh on every review and
# status call; a missing or invalid file fails the review closed. `rubric_id` is
# cross-checked against the phase kind that selects this file and is excluded
# from the rubric digest. Criterion order is significant: the digest and the
# review contract both depend on it. See README.md for the editing rules.
rubric_id: implementation-v1
schema_version: "1"
kind: implementation
mode: adversarial
criteria:
  - id: substantive-correctness
    text: "Report only a material defect in a declared phase output or its current post-change behavior. The declared output must have introduced, exposed, or materially worsened the defect. A blocking finding must cite exact changed, pinned, or repository evidence, name the concrete consequence, and explain why it survives the phase design's non-goals and priorities. Do not report pre-existing unrelated defects, optional cleanup, stylistic preferences, true-but-inconsequential observations, or harmless refinements."
    blocking: true
  - id: design-conformance
    text: "Report only a behavior, interface, file, or verification deviation from the pinned phase design that materially changes the approved outcome or leaves parent documents materially false. If missing phase-design evidence prevents that judgment, use unverifiable-claims."
    blocking: true
  - id: interface-fidelity
    text: "Report a changed-to-unchanged interface mismatch only when it is reasonably likely to break behavior, data, compatibility, or an important contract. Use unverifiable-claims only when missing interface evidence prevents a material judgment."
    blocking: true
  - id: verification-evidence
    text: "Report missing or failed verification only when the phase design requires it for an important behavior or risk. Claimed but untranscribed required verification is unverifiable, not a pass."
    blocking: true
  - id: test-quality
    text: "Optimize distinct regression protection per unit of test work. Report a missing case only when a required behavior, trust boundary, failure mode, lifecycle transition, or materially different branch could regress without detection and no existing test provides an equivalent oracle; prefer the cheapest credible seam and existing fixtures. Report tests that cannot fail for the behavior they claim to cover, self-derived or tautological oracles, assertions so thoroughly replaced by test doubles that real collaborators are never exercised, and removed, skipped, or weakened checks that no longer guard required behavior. Report duplication only when tests exercise equivalent setup, behavior, and oracle without adding boundary value, and group related duplicates into one finding that names the concrete runtime or maintenance cost. A blocking finding must cite the exact required behavior that can regress undetected or the disproportionate cost that materially harms delivery. Do not request raw coverage targets, exhaustive matrices, test-structure preferences, a preferred framework, or expensive fixtures for low-risk behavior."
    blocking: true
  - id: anti-shortcut
    text: "Report a shortcut only when it substitutes the appearance of success for the required behavior on the change path: a stub, TODO, or unimplemented placeholder standing in for required logic; a silently narrowed scope or quietly skipped requirement the approved phase design names; a caught error or failure condition discarded so the failure is invisible; or a check that compares against a hardcoded expected value or special-cases the tested output instead of computing the required result. A blocking finding must cite the exact changed location and the required behavior it bypasses. Do not report work the approved phase design explicitly defers to a later phase."
    blocking: true
  - id: simplicity
    text: "Report complexity only when it materially harms correctness, maintainability, change cost, or the approved operating envelope; do not report a merely preferred simpler implementation. Report custom implementations of standard domain problems where well-tested, widely-adopted libraries or standard platform APIs exist in the ecosystem and are appropriate for the project's dependency budget."
    blocking: true
  - id: duplication
    text: "Report duplication only when it creates a concrete material risk of divergence, defects, or disproportionate maintenance; do not request an abstraction for small or clearer repetition."
    blocking: true
  - id: dead-code
    text: "Report unreachable code, compatibility paths, or speculative extensions only when they materially affect behavior, safety, maintenance, or the approved scope."
    blocking: true
  - id: error-handling
    text: "Report an unhandled boundary failure only when it is reasonably likely and carries a material consequence under the current operating envelope."
    blocking: true
  - id: unverifiable-claims
    text: "When missing envelope or read-only repository evidence prevents a material judgment, record one non-blocking finding naming exactly what is missing, with a finding_id beginning unverifiable-. Never guess. Omit gaps that cannot materially affect the review and report each material gap once."
    blocking: false
  - id: reviewer-confidence
    text: "When a material judgment cannot be made with confidence from the artifact, its digest-checked verification transcript, and the supplied repository snapshot, record one non-blocking finding with a finding_id beginning escalate-, citing the exact judgment that could not be made and what evidence or clarification would settle it. Report escalate- only for a question that could materially change the verdict; a missing document or evidence gap belongs to unverifiable-claims, and never guess in either place."
    blocking: false
  - id: advisory-observations
    text: "Do not report non-material observations, optional cleanup, completeness suggestions, stylistic preferences, or harmless refinements. A true observation or discrepancy that would not break production or change downstream behavior is not a defect; never report it. A sound implementation should return no findings rather than a list of possible enhancements. Formatting, lint, type-checking, naming, and import-order findings belong to the deterministic tools that own them; never report them."
    blocking: false
