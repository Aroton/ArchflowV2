# Server-owned counter-review rubric for the "phase-impl" phase kind.
#
# The MCP server reads and strictly parses this file fresh on every review and
# status call; a missing or invalid file fails the review closed. `rubric_id` is
# cross-checked against the phase kind that selects this file and is excluded
# from the rubric digest. Criterion order is significant: the digest and the
# review contract both depend on it. See README.md for the editing rules.
rubric_id: implementation-v1
schema_version: "1"
kind: implementation
mode: adversarial
criteria:
  - id: substantive-correctness
    text: "Find consequential bugs, design flaws, or unsafe behavior in a declared phase output or its current post-change behavior. Investigate problems introduced, exposed, or materially worsened by the changes; leave pre-existing unrelated defects outside this review. A real defect matters even when the plan never mentioned it."
    blocking: true
  - id: design-conformance
    text: "Use the approved design to understand intent and constraints. Report a discrepancy only when it causes a concrete problem in behavior, interfaces, or subsequent work; different file organization or wording alone is not a defect."
    blocking: true
  - id: interface-fidelity
    text: "Trace changed interfaces through their existing callers and dependencies. Report an evidenced mismatch that can break behavior, data, or compatibility."
    blocking: true
  - id: verification-evidence
    text: "Check the verification record in implementation notes, any supplied verification log or excerpt, and relevant code and tests. Raw logs are optional supporting evidence; a digest identifies bytes, not execution. Do not infer success from omitted output or demand a complete raw log when available evidence supports the behavior. Report missing, failed, or misleading verification when it leaves an important behavior or safety boundary unsupported, whether or not the phase design requested that check; explain the concrete failure that remains undetected."
    blocking: true
  - id: test-quality
    text: "Assess distinct regression protection using existing tests and their actual assertions. Identify a concrete failure that could escape detection before requesting coverage, and accept an equivalent oracle at another layer. Prefer the cheapest credible check; flag duplicated or expensive fixtures only when their concrete cost materially harms delivery. Avoid raw coverage targets, exhaustive matrices, and test-structure preferences."
    blocking: true
  - id: anti-shortcut
    text: "Report implementations or checks that create the appearance of success while failing the intended behavior, such as a placeholder, swallowed error, hardcoded result, or weakened assertion. Cite the code path and the consequence; legitimate deferred work alone is not a defect."
    blocking: true
  - id: simplicity
    text: "Report complexity or bespoke machinery only when it causes a concrete correctness, safety, or substantial maintenance problem. A library or simpler alternative being available is not enough; explain the failure or disproportionate cost it would address."
    blocking: true
  - id: duplication
    text: "Report duplicated logic only when there is a concrete divergence problem or substantial maintenance cost. Small clear repetition does not require an abstraction."
    blocking: true
  - id: dead-code
    text: "Report unused code or speculative extensions only when they cause a concrete behavior, safety, or substantial maintenance problem."
    blocking: true
  - id: error-handling
    text: "Check likely boundary failures on the changed path. Explain the reachable condition, the resulting incorrect or unsafe behavior, and the supporting evidence."
    blocking: true
  - id: unverifiable-claims
    text: "Check the available code, tests, and context before claiming evidence is missing. If a specific missing item prevents assessing an important behavior, explain the limit and why it matters; do not infer a defect from absence in the plan or report alone."
    blocking: false
  - id: reviewer-confidence
    text: "Distinguish demonstrated problems from uncertainty. Investigate a plausible concern proportionally; report unresolved uncertainty only with a concrete failure scenario, supporting evidence, and the observation needed to settle it."
    blocking: false
  - id: advisory-observations
    text: "Leave out speculative risks, optional polish, preferred alternatives, and additional coverage without an identified undetected failure. If no supported material concern remains, say so."
    blocking: false
