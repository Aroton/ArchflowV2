# Server-owned counter-review rubric for the "prd" phase kind.
#
# The MCP server reads and strictly parses this file fresh on every review and
# status call; a missing or invalid file fails the review closed. `rubric_id` is
# cross-checked against the phase kind that selects this file and is excluded
# from the rubric digest. Criterion order is significant: the digest and the
# review contract both depend on it. See README.md for the editing rules.
rubric_id: prd-v1
schema_version: "1"
kind: artifact
mode: adversarial
criteria:
  - id: substantive-correctness
    text: "Find consequential product flaws, unsafe outcomes, or requirements that cannot be meaningfully verified. Focus on user-visible outcomes, scope, product tradeoffs, and observable acceptance. Explain the concrete downstream problem using the stated goal and available evidence; leave architecture and harmless implementation choices to later design."
    blocking: true
  - id: ask-fidelity
    text: "Use the original request and recorded clarifications to understand the desired outcome. Report an omission, exclusion, or contradiction only when it would materially change what the user gets, rather than enforcing a word-for-word checklist."
    blocking: true
  - id: proportionality
    text: "Report proposed scope, process, or premature implementation prescriptions only when they create a concrete product problem or disproportionate delivery or maintenance cost. A preferred smaller solution, document length, or missing template section alone is not a finding."
    blocking: true
  - id: testable-requirements
    text: "Identify an important outcome that reasonable implementers could interpret incompatibly or that available verification cannot distinguish from failure. Check existing behavior and tests before demanding additional specificity or coverage."
    blocking: true
  - id: stated-assumptions
    text: "Identify unsupported assumptions or unresolved choices only when they can lead to a concrete product, safety, or acceptance problem. Preserve harmless implementation latitude."
    blocking: true
  - id: unverifiable-claims
    text: "Check the available request, code, tests, and context before claiming evidence is missing. Explain an evidence gap only when it prevents assessing an important outcome; absence from the PRD alone proves neither a defect nor a missing capability."
    blocking: false
  - id: reviewer-confidence
    text: "Investigate plausible concerns proportionally. Distinguish uncertainty from an evidenced defect, and report unresolved uncertainty only with a concrete failure scenario and what would settle it."
    blocking: false
  - id: advisory-observations
    text: "Leave out speculative risks, optional polish, preferred alternatives, and coverage demands without an identified undetected failure. If no supported material concern remains, say so."
    blocking: false
